# Development environment. Mail/database fixtures require the integration profile.
services:
  mail:
    image: ghcr.io/docker-mailserver/docker-mailserver:16.0.1
    profiles: [integration]
    hostname: mail
    container_name: rl.mail
    domainname: domain.com
    restart: always
    ports:
      - 127.0.0.1:2525:25
      - 127.0.0.1:1143:143
    volumes:
      - maildata-v2:/var/mail
      - mailstate-v2:/var/mail-state
      - ./.docker/mail/config/:/tmp/docker-mailserver/
    environment:
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=0
      - ENABLE_POSTGREY=0
      - ENABLE_MANAGESIEVE=1
      - ONE_DIR=1
      - LOG_LEVEL=info
  db:
    image: mysql:8.4
    profiles: [integration]
    hostname: db
    container_name: rl.db
    restart: always
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: rainloop
      MYSQL_PASSWORD: ${RAINLOOP_DB_PASSWORD:-}
      MYSQL_DATABASE: rainloop
    volumes:
      - mysql-v2:/var/lib/mysql
      - tmp:/tmp
  php:
    build:
      context: ./.docker/php
    hostname: php
    container_name: rl.php
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - 9000
    volumes:
      - ./:/var/www:ro
      # - ./build/local/:/var/www
      - rainloop-data:/var/www/data
  node:
    build:
      context: ./.docker/node
    profiles: [tools]
    hostname: node
    container_name: rl.node
    working_dir: /var/www
    command: ["yarn", "--version"]
    volumes:
      - ./:/var/www
      - tmp:/tmp
  nginx:
    image: nginx:latest
    hostname: nginx
    container_name: rl.nginx
    depends_on:
      - php
    ports:
      - 443:443
      - 80:80
    volumes:
      - ./:/var/www
      # - ./build/local/:/var/www
      - ./.docker/nginx/ssl:/etc/nginx/ssl
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - tmp:/tmp
  tx:
    build:
      context: ./.docker/tx
    profiles: [tools]
    hostname: tx
    container_name: rl.tx
    working_dir: /var/www
    command: ["--version"]
    volumes:
      - ./:/var/www
      - ./.docker/.cache/tx/home:/home/nonroot
      - tmp:/tmp

volumes:
  rainloop-data:
    driver: local
  mysql-v2:
    driver: local
  maildata-v2:
    driver: local
  mailstate-v2:
    driver: local
  # Archived integration volumes are retained; migration is a separate operation.
  mysql:
    driver: local
  maildata:
    driver: local
  mailstate:
    driver: local
  tmp:
    driver: local
