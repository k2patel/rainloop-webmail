# Merge this server block into /etc/httpd.conf.
# Paths under root and the FastCGI socket are relative to httpd's /var/www chroot.
# Check on OpenBSD before reloading: httpd -n -f /etc/httpd.conf
server "mail.k2patel.in" {
    listen on egress tls port 443
    gzip-static
    tls {
        certificate "/etc/ssl/mail.k2patel.in.fullchain.pem"
        key "/etc/ssl/private/mail.k2patel.in.key"
    }
    root "/htdocs/rainloop"
    directory index "index.php"
    directory no auto index
    tcp { nodelay, backlog 10 }
    hsts {
        max-age 31556952
        preload
    }
    connection max request body 26214400

    # Only explicitly permitted paths are served. Locations match in order.
    block return 403
    location "/.well-known/acme-challenge/*" {
        pass
        root "/acme"
        request strip 2
        directory no auto index
    }
    location "*/.*" {
        block return 403
    }
    location "/" {
        pass
        fastcgi {
            socket "/run/php-fpm.sock"
            param SCRIPT_FILENAME "/htdocs/rainloop/index.php"
            param SCRIPT_NAME "/index.php"
        }
    }
    location "/index.php" {
        pass
        fastcgi socket "/run/php-fpm.sock"
    }
    location "*.php*" {
        block return 403
    }
    location "/rainloop/v/*/static/*" {
        pass
    }
    log access "rainloop_access.log"
    log error "rainloop_error.log"
}
