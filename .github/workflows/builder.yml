name: Maintained v2 release artifacts

on:
  push:
    tags:
    - 'v2.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: node:24-bookworm

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        persist-credentials: false

    - name: Check maintained release line
      run: node tests/release-version.cjs
      env:
        RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    - run: yarn install --frozen-lockfile --ignore-scripts --non-interactive
    - run: node tests/openpgp.mjs
    - run: yarn build
    # Artifacts stay separate from archived 1.x. Publication/signing is a separate
    # maintainer step after the security and third-party license gaps are resolved.
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: rainloop-webmail-maintained-v2
        path: build/dist/releases/webmail/2.*/rainloop-webmail-2.*.zip*
        if-no-files-found: error
