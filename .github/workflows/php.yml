name: PHP compatibility and security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh tests/build-frontend.sh
      - run: node tests/openpgp.mjs
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:browser
      - run: yarn audit:dependencies
      - run: yarn build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-test-package
          path: build/dist/releases/webmail/2.*/rainloop-webmail-fork-2.*.zip
          if-no-files-found: error
  upgrade:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: curl, dom, iconv, mbstring, openssl, pdo_sqlite, gd, intl, zip
          coverage: none
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upgrade-test-package
          path: build/upgrade-test
      - run: sh tests/upgrade-in-place.sh build/upgrade-test/rainloop-webmail-fork-$(node -p "require('./package.json').version").zip
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, iconv, mbstring, openssl, pdo_sqlite, gd, intl, zip
          coverage: none
      - run: php tests/php/run.php
  distroless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t rainloop-php:test .docker/php
      - run: docker run --rm rainloop-php:test --test
      - run: >-
          docker run --rm --read-only --tmpfs /tmp
          --entrypoint /usr/local/bin/php
          -v "$PWD:/work:ro" -w /work rainloop-php:test tests/php/container.php
      - run: >-
          docker run --rm --read-only --tmpfs /tmp
          --entrypoint /usr/local/bin/php
          -v "$PWD:/work:ro" -w /work rainloop-php:test tests/php/run.php
