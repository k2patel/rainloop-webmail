name: PHP security scan

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '34 6 * * 1'

permissions:
  contents: read

jobs:
  php-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan PHP and plugin source
        run: >-
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.182.1
          semgrep scan --config p/php --config p/security-audit
          --include '*.php' --metrics=off --disable-version-check --error --strict
          --json-output semgrep-php.json
          --sarif-output semgrep-php.sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: php-security-results
          path: |
            semgrep-php.json
            semgrep-php.sarif
          if-no-files-found: warn
