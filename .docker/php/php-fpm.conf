[global]
daemonize = no
error_log = /proc/self/fd/2

[www]
listen = 9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
clear_env = yes
catch_workers_output = yes
decorate_workers_output = no
security.limit_extensions = .php
